<nav class="main-header navbar navbar-expand navbar-white navbar-light">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" data-widget="pushmenu" href="#" role="button">
        <i class="fas fa-bars"></i>
      </a>
    </li>
  </ul>

  <ul class="navbar-nav ml-auto">
    <!-- Rol badge -->
    <li class="nav-item d-flex align-items-center mr-2">
      <span id="navbar-rol" class="badge" [ngClass]="rolBadgeClass">{{ rolLabel }}</span>
    </li>

    <!-- Indicador de sesión -->
    <li class="nav-item">
      <a class="nav-link" (click)="togglePopover()" style="cursor:pointer;">
        <i class="fas fa-circle" [ngClass]="sessionStatusClass" style="font-size:10px;"></i>
        <span class="ml-1" style="font-size:12px;">Sesión</span>
      </a>
      <div *ngIf="showPopover" class="card card-sm" style="position:absolute;right:10px;top:50px;z-index:9999;width:250px;box-shadow:0 4px 16px rgba(0,0,0,.18);">
        <div class="card-body p-3" style="font-size:13px;">
          <div class="mb-1"><i class="fas fa-envelope mr-1"></i>{{ tokenInfo?.email }}</div>
          <div class="mb-1"><i class="fas fa-clock mr-1"></i>Expira: {{ tokenInfo?.expiresAt }}</div>
          <div class="mb-2">Tiempo restante: {{ tokenInfo?.expiresInSec }}s</div>
          <button class="btn btn-xs btn-outline-primary mr-1" (click)="renewSession()">Renovar</button>
          <button class="btn btn-xs btn-outline-danger" (click)="logout()">Salir</button>
        </div>
      </div>
    </li>
  </ul>
</nav>
