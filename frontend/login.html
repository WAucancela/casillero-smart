<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Casilleros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    body { background: linear-gradient(135deg, #0f1623 0%, #1e2a4a 60%, #0d3060 100%); min-height:100vh; }
    .login-box { width:400px; }

    .brand-logo { text-align:center; margin-bottom:28px; }
    .brand-logo .icon-wrap {
      width:72px; height:72px; border-radius:18px;
      background: linear-gradient(135deg,#007bff,#0056b3);
      display:inline-flex; align-items:center; justify-content:center;
      font-size:30px; color:#fff; margin-bottom:14px;
      box-shadow: 0 8px 32px rgba(0,123,255,0.35);
    }
    .brand-logo .name { font-family:'Space Mono',monospace; color:#fff; font-size:20px; letter-spacing:0.12em; margin:0; }
    .brand-logo .sub  { color:rgba(255,255,255,0.4); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin:4px 0 0; }

    .login-card { border-radius:16px; border:none; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
    .login-card .card-body { padding:32px; }

    .field-label { font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:#6c757d; font-weight:600; margin-bottom:5px; display:block; }
    .field-wrap  { position:relative; }
    .field-wrap .form-control { padding-right:44px; border:1.5px solid #e9ecef; border-radius:8px; height:46px; font-size:14px; transition:border-color .2s, box-shadow .2s; }
    .field-wrap .form-control:focus { border-color:#007bff; box-shadow:0 0 0 3px rgba(0,123,255,0.12); }
    .field-wrap .field-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#adb5bd; cursor:pointer; font-size:14px; }

    .btn-login { height:46px; font-size:14px; font-weight:600; border-radius:8px; letter-spacing:0.03em; transition:all .2s; }
    .btn-login:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,123,255,0.35); }
    .btn-login:disabled { opacity:0.7; cursor:not-allowed; }

    .alert-login { border-radius:8px; font-size:13px; padding:10px 14px; border:none; }
    .alert-login.session { background:#fff3cd; color:#856404; border-left:4px solid #ffc107; }
    .alert-login.expired { background:#f8d7da; color:#721c24; border-left:4px solid #dc3545; }
    .alert-login.error   { background:#f8d7da; color:#721c24; border-left:4px solid #dc3545; }
    .alert-login.info    { background:#d1ecf1; color:#0c5460; border-left:4px solid #17a2b8; }

    .login-footer { text-align:center; margin-top:16px; font-size:11px; color:rgba(255,255,255,0.3); }

    /* Indicador de fuerza de contraseña (oculto en login, visible en primer login) */
    .session-info { font-size:11px; color:#6c757d; text-align:center; margin-top:12px; }
    .session-info .mono { color:#007bff; }
  </style>
</head>
<body class="hold-transition login-page">

<div class="login-box">
  <!-- Logo -->
  <div class="brand-logo">
    <div class="icon-wrap"><i class="fas fa-lock"></i></div>
    <p class="name">CASILLEROS</p>
    <p class="sub">Sistema de gestión v1.0</p>
  </div>

  <!-- Tarjeta -->
  <div class="card login-card">
    <div class="card-body">
      <h5 style="font-weight:600; margin-bottom:24px; color:#1a1f2e; font-size:16px;">
        <i class="fas fa-shield-alt text-primary mr-2"></i>Panel de administración
      </h5>

      <!-- Banner de razón de cierre (session_expired, inactivity, logout_other_tab) -->
      <div id="reason-banner" style="display:none;" class="alert-login mb-4"></div>

      <div class="form-group">
        <label class="field-label" for="email">Correo electrónico</label>
        <div class="field-wrap">
          <input id="email" type="email" class="form-control" placeholder="admin@empresa.com"
                 autocomplete="username" autofocus>
          <i class="fas fa-envelope field-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="field-label" for="password">Contraseña</label>
        <div class="field-wrap">
          <input id="password" type="password" class="form-control" placeholder="••••••••"
                 autocomplete="current-password">
          <i class="fas fa-eye field-icon" id="toggle-pass" onclick="togglePassword()"></i>
        </div>
      </div>

      <div id="error-msg" style="display:none;" class="alert-login error mb-3"></div>

      <button id="btn-login" class="btn btn-primary btn-block btn-login" onclick="doLogin()">
        <i class="fas fa-sign-in-alt mr-2"></i>Iniciar sesión
      </button>

      <div class="session-info mt-3">
        Sesión activa por <span class="mono">8 horas</span> · Cierre automático por inactividad: <span class="mono">30 min</span>
      </div>
    </div>
  </div>

  <div class="login-footer">Casilleros Automatizados &copy; 2026 · Acceso solo para administradores</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api-client.js"></script>
<script>
// ── Leer parámetros de la URL ────────────────────────────────
const params = new URLSearchParams(window.location.search);
const reason = params.get("reason");
const next   = params.get("next");   // URL a la que volver tras login

// Si ya tiene sesión válida, redirigir directamente
(async () => {
  if (await AuthModule.isAuthenticated()) {
    window.location.href = next ? decodeURIComponent(next) : "dashboard.html";
  }
})();

// ── Mostrar banner según la razón del cierre ─────────────────
const bannerEl = document.getElementById("reason-banner");
const mensajes = {
  session_expired:    { cls:"expired", icon:"fa-clock",           text:"Tu sesión ha expirado. Inicia sesión nuevamente." },
  inactivity:         { cls:"session", icon:"fa-moon",            text:"Sesión cerrada por inactividad (30 min sin actividad)." },
  logout_other_tab:   { cls:"info",    icon:"fa-sign-out-alt",    text:"Sesión cerrada desde otra pestaña del navegador." },
};
if (reason && mensajes[reason]) {
  const m = mensajes[reason];
  bannerEl.className = `alert-login ${m.cls} mb-4`;
  bannerEl.innerHTML = `<i class="fas ${m.icon} mr-2"></i>${m.text}`;
  bannerEl.style.display = "block";
  // Prellenar el email si lo tenemos guardado
  const email = AuthModule.getEmail();
  if (email) document.getElementById("email").value = email;
}

// ── Alternar visibilidad de contraseña ───────────────────────
function togglePassword() {
  const inp = document.getElementById("password");
  const ico = document.getElementById("toggle-pass");
  inp.type = inp.type === "password" ? "text" : "password";
  ico.className = `fas fa-${inp.type === "password" ? "eye" : "eye-slash"} field-icon`;
}

// ── Login ────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errEl    = document.getElementById("error-msg");
  const btnEl    = document.getElementById("btn-login");

  errEl.style.display = "none";

  if (!email || !password) {
    errEl.innerHTML = "<i class='fas fa-exclamation-circle mr-2'></i>Completa todos los campos.";
    errEl.style.display = "block";
    return;
  }

  btnEl.disabled = true;
  btnEl.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Verificando...`;

  try {
    await API.auth.login(email, password);
    // Redirigir a la página que el usuario intentaba visitar, o al dashboard
    const destino = next ? decodeURIComponent(next) : "dashboard.html";
    window.location.href = destino;
  } catch (err) {
    const msg = err.status === 401
      ? "Credenciales incorrectas. Verifica tu email y contraseña."
      : err.status === 0
        ? "No se puede conectar al servidor. ¿Está el backend corriendo?"
        : err.message || "Error inesperado. Intenta de nuevo.";

    errEl.innerHTML = `<i class="fas fa-times-circle mr-2"></i>${msg}`;
    errEl.style.display = "block";
    btnEl.disabled = false;
    btnEl.innerHTML = `<i class="fas fa-sign-in-alt mr-2"></i>Iniciar sesión`;
    document.getElementById("password").focus();
  }
}

document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
