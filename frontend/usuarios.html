<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | Casilleros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="css/shared.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a></li></ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><span class="nav-link"><span class="live-dot"></span><small id="reloj" class="mono"></small></span></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></a></li>
    </ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="dashboard.html" class="brand-link"><i class="fas fa-lock brand-image ml-1" style="color:#007bff;font-size:1.4rem;"></i><span class="brand-text font-weight-bold">CASILLEROS</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image"><i class="fas fa-user-shield fa-lg text-secondary ml-2 mt-1"></i></div>
        <div class="info"><a href="#" class="d-block" id="sidebar-nombre">Administrador</a><small id="sidebar-email" class="text-muted d-block"></small><small id="sidebar-rol" class="badge" style="font-size:9px;"></small></div>
      </div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" id="sidebar-nav"></ul></nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1 class="m-0"><i class="fas fa-users mr-2 text-primary"></i>Gestión de Usuarios</h1></div>
        <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a href="dashboard.html">Inicio</a></li><li class="breadcrumb-item active">Usuarios</li></ol></div>
      </div>
    </div></div>

    <div class="content"><div class="container-fluid">
      <div class="row" id="stats-usuarios"></div>

      <div class="filter-bar">
        <div class="form-group"><label>Buscar</label>
          <input id="f-search" type="text" class="form-control form-control-sm" placeholder="Nombre, email…" style="width:220px;" oninput="filtrarTabla()">
        </div>
        <div class="form-group"><label>Estado</label>
          <select id="f-estado" class="form-control form-control-sm" style="width:180px;" onchange="filtrarTabla()">
            <option value="">Todos</option>
            <option value="activo">Activo</option>
            <option value="pendiente_biometria">Pendiente biometría</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
        <div class="form-group"><label>Departamento</label>
          <select id="f-depto" class="form-control form-control-sm" style="width:160px;" onchange="filtrarTabla()">
            <option value="">Todos</option>
            <option>Tecnología</option><option>Finanzas</option><option>RRHH</option><option>Marketing</option><option>Operaciones</option>
          </select>
        </div>
        <div class="ml-auto d-flex" style="gap:8px;">
          <button class="btn btn-outline-secondary btn-sm" onclick="cargarUsuarios()"><i class="fas fa-sync mr-1"></i>Actualizar</button>
          <button class="btn btn-primary" onclick="$('#modal-nuevo-usuario').modal('show')"><i class="fas fa-user-plus mr-1"></i>Nuevo Usuario</button>
        </div>
      </div>

      <div class="card card-outline card-primary elevation-2">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-table mr-2"></i>Listado de Usuarios</h3>
          <div class="card-tools"><span class="badge badge-primary mono" id="badge-count">—</span></div>
        </div>
        <div class="card-body p-0">
          <div id="tabla-container">
            <div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
          </div>
        </div>
      </div>
    </div></div>
  </div>
  <footer class="main-footer"><strong>Casilleros Automatizados</strong> &copy; 2026</footer>
</div>

<!-- Modal detalle -->
<div class="modal fade" id="modal-detalle" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-info text-white">
      <h5 class="modal-title"><i class="fas fa-user mr-2"></i>Detalle de Usuario</h5>
      <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
    </div>
    <div class="modal-body" id="modal-detalle-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
      <button class="btn btn-warning" id="btn-asignar-cas" onclick="abrirModalCasillero()"><i class="fas fa-box mr-1"></i>Asignar casillero</button>
      <button class="btn btn-outline-warning" id="btn-quitar-cas" onclick="quitarCasillero()"><i class="fas fa-box-open mr-1"></i>Quitar casillero</button>
      <button class="btn btn-danger"   id="btn-dar-baja"   onclick="darBaja()"><i class="fas fa-user-slash mr-1"></i>Dar de baja</button>
      <button class="btn btn-dark"     id="btn-eliminar"   onclick="eliminarUsuario()"><i class="fas fa-trash mr-1"></i>Eliminar</button>
    </div>
  </div></div>
</div>

<!-- Modal nuevo usuario -->
<div class="modal fade" id="modal-nuevo-usuario" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-primary text-white">
      <h5 class="modal-title"><i class="fas fa-user-plus mr-2"></i>Nuevo Usuario</h5>
      <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
    </div>
    <div class="modal-body">
      <div class="row">
        <div class="col-6 form-group">
          <label>Nombre *</label>
          <input id="nu-nombre" type="text" class="form-control" placeholder="Ana">
          <small class="text-danger d-none" id="nu-err-nombre">Requerido</small>
        </div>
        <div class="col-6 form-group">
          <label>Apellido *</label>
          <input id="nu-apellido" type="text" class="form-control" placeholder="García">
          <small class="text-danger d-none" id="nu-err-apellido">Requerido</small>
        </div>
      </div>
      <div class="form-group">
        <label>Email corporativo *</label>
        <input id="nu-email" type="email" class="form-control" placeholder="ana.garcia@empresa.com">
        <small class="text-danger d-none" id="nu-err-email">Email inválido</small>
      </div>
      <div class="row">
        <div class="col-8 form-group">
          <label>Departamento *</label>
          <select id="nu-depto" class="form-control">
            <option value="">Seleccionar…</option>
            <option>Tecnología</option>
            <option>Finanzas</option>
            <option>RRHH</option>
            <option>Marketing</option>
            <option>Operaciones</option>
          </select>
          <small class="text-danger d-none" id="nu-err-depto">Requerido</small>
        </div>
        <div class="col-4 form-group">
          <label>Piso preferido</label>
          <select id="nu-piso" class="form-control">
            <option value="">Cualquiera</option>
            <option value="1">Piso 1</option>
            <option value="2">Piso 2</option>
            <option value="3">Piso 3</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-usuario" onclick="guardarNuevoUsuario()">
        <i class="fas fa-save mr-1"></i>Guardar
      </button>
    </div>
  </div></div>
</div>

<!-- Modal selección de casillero -->
<div class="modal fade" id="modal-casillero" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header bg-warning">
      <h5 class="modal-title"><i class="fas fa-box mr-2"></i>Asignar Casillero</h5>
      <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Selecciona un casillero disponible</label>
        <select id="select-casillero" class="form-control">
          <option value="">Cargando...</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
      <button class="btn btn-warning" onclick="confirmarAsignacion()"><i class="fas fa-check mr-1"></i>Asignar</button>
    </div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/auth.js"></script>
<script src="js/api-client.js"></script>
<script src="js/layout.js"></script>
<script>
if (!requireAuth()) throw new Error("no auth");
renderLayout("usuarios");
iniciarReloj();

let todosUsuarios = [];
let selectedId    = null;

async function cargarUsuarios() {
  document.getElementById("tabla-container").innerHTML =
    `<div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>`;
  try {
    todosUsuarios = await API.usuarios.listar();
    renderStats();
    filtrarTabla();
  } catch (err) {
    document.getElementById("tabla-container").innerHTML = `
      <div class="text-center py-5">
        <i class="fas fa-exclamation-triangle fa-2x text-danger mb-2 d-block"></i>
        <span class="text-danger">${err.message}</span><br>
        <button class="btn btn-sm btn-outline-danger mt-2" onclick="cargarUsuarios()">
          <i class="fas fa-redo mr-1"></i>Reintentar
        </button>
      </div>`;
  }
}

function renderStats() {
  const data = [
    { label:"Activos",    val:todosUsuarios.filter(u=>u.estado==="activo").length,              color:"success",   icon:"fa-check-circle" },
    { label:"Pendientes", val:todosUsuarios.filter(u=>u.estado==="pendiente_biometria").length, color:"warning",   icon:"fa-clock"        },
    { label:"Inactivos",  val:todosUsuarios.filter(u=>u.estado==="inactivo").length,            color:"secondary", icon:"fa-ban"          },
    { label:"Total",      val:todosUsuarios.length,                                             color:"primary",   icon:"fa-users"        },
  ];
  document.getElementById("stats-usuarios").innerHTML = data.map(s => `
    <div class="col-lg-3 col-6">
      <div class="card stat-card elevation-2" style="border-color:var(--${s.color})">
        <div class="card-body">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value text-${s.color}">${s.val}</div>
          <i class="fas ${s.icon} stat-icon text-${s.color}"></i>
        </div>
      </div>
    </div>`).join("");
}

function filtrarTabla() {
  const q  = document.getElementById("f-search").value.toLowerCase();
  const st = document.getElementById("f-estado").value;
  const dp = document.getElementById("f-depto").value;
  const filtrados = todosUsuarios.filter(u => {
    const nombre = `${u.nombre} ${u.apellido}`.toLowerCase();
    if (q  && !nombre.includes(q) && !u.email.toLowerCase().includes(q)) return false;
    if (st && u.estado       !== st) return false;
    if (dp && u.departamento !== dp) return false;
    return true;
  });
  document.getElementById("badge-count").textContent = `${filtrados.length} usuarios`;
  document.getElementById("tabla-container").innerHTML = filtrados.length
    ? `<div class="table-responsive"><table class="table table-striped table-hover mb-0">
        <thead class="thead-light">
          <tr><th>#</th><th>Nombre</th><th>Email</th><th>Departamento</th><th>Piso</th><th>Casillero</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>${filtrados.map(u => `
          <tr>
            <td class="mono text-muted" style="font-size:11px;">${u.id}</td>
            <td><strong>${u.nombre_completo || u.nombre + " " + u.apellido}</strong></td>
            <td style="font-size:13px;">${u.email}</td>
            <td><span class="badge badge-light">${u.departamento}</span></td>
            <td class="mono">${u.piso_preferido || "—"}</td>
            <td class="mono" style="color:#007bff;">${u.casillero_numero || `<span class="text-muted">Sin asignar</span>`}</td>
            <td><span class="badge badge-${estadoColor[u.estado] || "secondary"}">
              <i class="fas ${estadoIcon[u.estado] || "fa-circle"} mr-1"></i>${u.estado.replace(/_/g," ")}
            </span></td>
            <td><button class="btn btn-xs btn-info" onclick="verDetalle(${u.id})"><i class="fas fa-eye"></i></button></td>
          </tr>`).join("")}
        </tbody>
      </table></div>`
    : `<div class="text-center py-5 text-muted"><i class="fas fa-inbox fa-2x mb-2 d-block"></i>Sin resultados</div>`;
}

function verDetalle(id) {
  const u = todosUsuarios.find(x => x.id === id);
  selectedId = id;
  document.getElementById("modal-detalle-body").innerHTML = `
    <div class="row mb-3">
      <div class="col-2 text-center"><i class="fas fa-user-circle fa-4x text-${estadoColor[u.estado] || "secondary"}"></i></div>
      <div class="col-10">
        <h5 class="mb-0">${u.nombre_completo || u.nombre + " " + u.apellido}</h5>
        <small class="text-muted">${u.email}</small><br>
        <span class="badge badge-${estadoColor[u.estado]} mt-1">${u.estado.replace(/_/g," ")}</span>
      </div>
    </div>
    <table class="table table-sm table-borderless">
      <tr><td class="text-muted" style="width:40%;">Departamento</td><td><strong>${u.departamento}</strong></td></tr>
      <tr><td class="text-muted">Piso preferido</td><td class="mono">${u.piso_preferido || "—"}</td></tr>
      <tr><td class="text-muted">Casillero</td><td class="mono" style="color:#007bff;">${u.casillero_numero || "Sin asignar"}</td></tr>
    </table>`;
  document.getElementById("btn-dar-baja").style.display    = u.estado === "inactivo" ? "none" : "inline-block";
  document.getElementById("btn-asignar-cas").style.display = u.casillero_numero ? "none" : "inline-block";
  document.getElementById("btn-quitar-cas").style.display  = u.casillero_numero ? "inline-block" : "none";
  $("#modal-detalle").modal("show");
}

async function darBaja() {
  if (!selectedId) return;
  if (!confirm("¿Confirma dar de baja a este usuario? Se liberará su casillero.")) return;
  try {
    await API.usuarios.darBaja(selectedId);
    $("#modal-detalle").modal("hide");
    toast("Usuario dado de baja correctamente.", "warning");
    cargarUsuarios();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

async function guardarNuevoUsuario() {
  const nombre   = document.getElementById("nu-nombre").value.trim();
  const apellido = document.getElementById("nu-apellido").value.trim();
  const email    = document.getElementById("nu-email").value.trim();
  const depto    = document.getElementById("nu-depto").value;
  const piso     = document.getElementById("nu-piso").value;

  // Validar
  let ok = true;
  const v = (campo, errId, condicion) => {
    const err = document.getElementById(errId);
    if (condicion) { err.classList.remove("d-none"); ok = false; }
    else            { err.classList.add("d-none"); }
  };
  v("nu-nombre",   "nu-err-nombre",   !nombre);
  v("nu-apellido", "nu-err-apellido", !apellido);
  v("nu-email",    "nu-err-email",    !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
  v("nu-depto",    "nu-err-depto",    !depto);
  if (!ok) return;

  const btn = document.getElementById("btn-guardar-usuario");
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i>Guardando…`;

  try {
    await API.usuarios.crear({
      nombre, apellido, email,
      departamento: depto,
      piso_preferido: piso ? Number(piso) : null,
    });
    $("#modal-nuevo-usuario").modal("hide");
    // Limpiar campos
    ["nu-nombre","nu-apellido","nu-email"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("nu-depto").value = "";
    document.getElementById("nu-piso").value  = "";
    toast(`Usuario <strong>${nombre} ${apellido}</strong> creado correctamente.`, "success");
    cargarUsuarios();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-save mr-1"></i>Guardar`;
  }
}

async function abrirModalCasillero() {
  const select = document.getElementById("select-casillero");
  select.innerHTML = `<option value="">Cargando...</option>`;
  $("#modal-casillero").modal("show");
  try {
    const disponibles = await API.casilleros.disponibles();
    if (!disponibles.length) {
      select.innerHTML = `<option value="">No hay casilleros disponibles</option>`;
      return;
    }
    select.innerHTML = disponibles.map(c =>
      `<option value="${c.id}">Casillero ${c.numero} — Piso ${c.piso}</option>`
    ).join("");
  } catch (err) {
    select.innerHTML = `<option value="">Error al cargar</option>`;
  }
}

async function confirmarAsignacion() {
  const casilleroId = document.getElementById("select-casillero").value;
  if (!casilleroId) return;
  try {
    const data = await API.casilleros.asignarManual(casilleroId, selectedId);
    $("#modal-casillero").modal("hide");
    $("#modal-detalle").modal("hide");
    toast(`Casillero <strong>${data.casillero_numero}</strong> asignado correctamente.`, "success");
    cargarUsuarios();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

async function quitarCasillero() {
  if (!selectedId) return;
  if (!confirm("¿Quitar el casillero asignado a este usuario?")) return;
  try {
    await API.casilleros.liberar(selectedId);
    $("#modal-detalle").modal("hide");
    toast("Casillero liberado correctamente.", "warning");
    cargarUsuarios();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

async function eliminarUsuario() {
  if (!selectedId) return;
  if (!confirm("¿Eliminar este usuario permanentemente? Esta acción no se puede deshacer.")) return;
  try {
    await API.usuarios.eliminar(selectedId);
    $("#modal-detalle").modal("hide");
    toast("Usuario eliminado permanentemente.", "danger");
    cargarUsuarios();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}


cargarUsuarios();
</script>
</body>
</html>
