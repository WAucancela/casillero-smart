<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administradores | Casilleros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="css/shared.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a></li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><span class="nav-link"><small id="reloj" class="mono"></small></span></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></a></li>
    </ul>
  </nav>

  <!-- Sidebar -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="dashboard.html" class="brand-link">
      <i class="fas fa-lock brand-image ml-1" style="color:#007bff;font-size:1.4rem;"></i>
      <span class="brand-text font-weight-bold">CASILLEROS</span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image"><i class="fas fa-user-shield fa-lg text-secondary ml-2 mt-1"></i></div>
        <div class="info">
          <a href="#" class="d-block" id="sidebar-nombre">Administrador</a>
          <small id="sidebar-email" class="text-muted"></small>
          <br><small id="sidebar-rol" class="badge badge-danger" style="font-size:9px;"></small>
        </div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" id="sidebar-nav"></ul>
      </nav>
    </div>
  </aside>

  <!-- Content -->
  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0"><i class="fas fa-user-shield mr-2 text-danger"></i>Administradores del Sistema</h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="dashboard.html">Inicio</a></li>
            <li class="breadcrumb-item active">Administradores</li>
          </ol>
        </div>
      </div>
    </div></div>

    <div class="content"><div class="container-fluid">

      <!-- Tabla -->
      <div class="card card-danger card-outline elevation-2">
        <div class="card-header d-flex align-items-center">
          <h3 class="card-title"><i class="fas fa-users-cog mr-2"></i>Usuarios con acceso al panel</h3>
          <div class="card-tools ml-auto">
            <button class="btn btn-danger btn-sm" onclick="abrirModalNuevo()">
              <i class="fas fa-plus mr-1"></i>Nuevo Administrador
            </button>
          </div>
        </div>
        <div class="card-body p-0" id="tabla-container">
          <div class="text-center py-5 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x mb-3 d-block"></i>
            <span style="font-size:14px;">Cargando...</span>
          </div>
        </div>
      </div>

    </div></div>
  </div><!-- /content-wrapper -->

  <footer class="main-footer"><div class="float-right d-none d-sm-block"><b>v1.0</b></div>Sistema de Casilleros Automatizados</footer>
</div><!-- /wrapper -->

<!-- Modal Nuevo Administrador -->
<div class="modal fade" id="modal-nuevo-admin" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="fas fa-user-plus mr-2"></i>Nuevo Administrador</h5>
        <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <div id="modal-error" class="alert alert-danger d-none"></div>
        <div class="form-group">
          <label>Nombre <span class="text-danger">*</span></label>
          <input type="text" id="nuevo-nombre" class="form-control" placeholder="Nombre">
        </div>
        <div class="form-group">
          <label>Apellido <span class="text-danger">*</span></label>
          <input type="text" id="nuevo-apellido" class="form-control" placeholder="Apellido">
        </div>
        <div class="form-group">
          <label>Email <span class="text-danger">*</span></label>
          <input type="email" id="nuevo-email" class="form-control" placeholder="correo@empresa.com">
        </div>
        <div class="form-group">
          <label>Contraseña <span class="text-danger">*</span></label>
          <input type="password" id="nuevo-password" class="form-control" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="form-group">
          <label>Rol <span class="text-danger">*</span></label>
          <select id="nuevo-rol" class="form-control">
            <option value="viewer">Operador</option>
            <option value="admin">Jefatura</option>
            <option value="superadmin">Super Usuario</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btn-guardar-admin" onclick="guardarNuevoAdmin()">
          <i class="fas fa-save mr-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api-client.js"></script>
<script src="js/layout.js"></script>
<script>
// ── Inicialización ────────────────────────────────────────────────────────────
(async () => {
  const ok = await guardRoute();
  if (!ok) return;

  // Verificar que sea superadmin
  const info = API.auth.getTokenInfo();
  if (!info || info.rol !== "superadmin") {
    // Decodificar el rol del token
    const token = localStorage.getItem("cas_access_token");
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
        if (payload.rol !== "superadmin") {
          window.location.href = "dashboard.html";
          return;
        }
      } catch {}
    }
  }

  renderLayout("administradores");
  iniciarReloj();
  cargarAdmins();
})();

// ── Reloj ─────────────────────────────────────────────────────────────────────
function iniciarReloj() {
  const el = document.getElementById("reloj");
  const tick = () => { if (el) el.textContent = new Date().toLocaleTimeString("es-EC"); };
  tick(); setInterval(tick, 1000);
}

// ── Cargar tabla ──────────────────────────────────────────────────────────────
async function cargarAdmins() {
  const container = document.getElementById("tabla-container");
  try {
    const admins = await API.admin.listar();
    if (!admins || admins.length === 0) {
      container.innerHTML = `<div class="text-center py-5 text-muted">
        <i class="fas fa-inbox fa-2x mb-3 d-block"></i>No hay administradores registrados.</div>`;
      return;
    }

    const rolBadge = (rol) => {
      const map = { superadmin: "danger", admin: "warning", viewer: "secondary" };
      const labels = { superadmin: "Super Usuario", admin: "Jefatura", viewer: "Operador" };
      return `<span class="badge badge-${map[rol]||'secondary'}">${labels[rol]||rol}</span>`;
    };

    container.innerHTML = `
      <table class="table table-hover table-sm mb-0">
        <thead class="thead-light">
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Último acceso</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${admins.map(a => `
          <tr id="row-${a.id}">
            <td class="mono">${a.id}</td>
            <td>${a.nombre} ${a.apellido}</td>
            <td><small>${a.email}</small></td>
            <td>${rolBadge(a.rol)}</td>
            <td>
              <span class="badge badge-${a.activo ? 'success' : 'secondary'}">
                ${a.activo ? 'Activo' : 'Inactivo'}
              </span>
            </td>
            <td><small class="text-muted">${a.ultimo_acceso ? new Date(a.ultimo_acceso).toLocaleString("es-EC") : "—"}</small></td>
            <td class="text-center">
              <select class="form-control form-control-sm d-inline-block mr-1" style="width:130px;"
                      onchange="cambiarRol(${a.id}, this.value)" title="Cambiar rol">
                <option value="viewer"     ${a.rol==='viewer'     ?'selected':''}>Operador</option>
                <option value="admin"      ${a.rol==='admin'      ?'selected':''}>Jefatura</option>
                <option value="superadmin" ${a.rol==='superadmin' ?'selected':''}>Super Usuario</option>
              </select>
              <button class="btn btn-sm ${a.activo ? 'btn-outline-secondary' : 'btn-outline-success'}"
                      onclick="toggleActivo(${a.id}, ${a.activo})"
                      title="${a.activo ? 'Desactivar' : 'Activar'}">
                <i class="fas fa-${a.activo ? 'ban' : 'check'}"></i>
              </button>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>`;
  } catch (e) {
    container.innerHTML = `<div class="text-center py-5 text-danger">
      <i class="fas fa-exclamation-triangle fa-2x mb-3 d-block"></i>
      ${e.message || "Error al cargar administradores"}
      <br><button class="btn btn-sm btn-outline-danger mt-2" onclick="cargarAdmins()">
        <i class="fas fa-redo mr-1"></i>Reintentar</button></div>`;
  }
}

// ── Cambiar rol ───────────────────────────────────────────────────────────────
async function cambiarRol(id, nuevoRol) {
  try {
    await API.admin.cambiarRol(id, nuevoRol);
    cargarAdmins();
  } catch (e) {
    alert("Error al cambiar rol: " + e.message);
    cargarAdmins(); // restaurar select
  }
}

// ── Toggle activo ─────────────────────────────────────────────────────────────
async function toggleActivo(id, estaActivo) {
  const accion = estaActivo ? "desactivar" : "activar";
  if (!confirm(`¿Confirmas ${accion} este administrador?`)) return;
  try {
    await API.admin.toggleActivo(id);
    cargarAdmins();
  } catch (e) {
    alert("Error: " + e.message);
  }
}

// ── Modal nuevo admin ─────────────────────────────────────────────────────────
function abrirModalNuevo() {
  document.getElementById("nuevo-nombre").value    = "";
  document.getElementById("nuevo-apellido").value  = "";
  document.getElementById("nuevo-email").value     = "";
  document.getElementById("nuevo-password").value  = "";
  document.getElementById("nuevo-rol").value       = "viewer";
  document.getElementById("modal-error").classList.add("d-none");
  $("#modal-nuevo-admin").modal("show");
}

async function guardarNuevoAdmin() {
  const errorEl = document.getElementById("modal-error");
  const btn     = document.getElementById("btn-guardar-admin");
  errorEl.classList.add("d-none");

  const nombre   = document.getElementById("nuevo-nombre").value.trim();
  const apellido = document.getElementById("nuevo-apellido").value.trim();
  const email    = document.getElementById("nuevo-email").value.trim();
  const password = document.getElementById("nuevo-password").value;
  const rol      = document.getElementById("nuevo-rol").value;

  if (!nombre || !apellido || !email || !password) {
    errorEl.textContent = "Todos los campos son obligatorios.";
    errorEl.classList.remove("d-none");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Guardando...';
  try {
    await API.admin.crear({ nombre, apellido, email, password, rol });
    $("#modal-nuevo-admin").modal("hide");
    cargarAdmins();
  } catch (e) {
    errorEl.textContent = e.message || "Error al crear administrador";
    errorEl.classList.remove("d-none");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save mr-1"></i>Guardar';
  }
}
</script>
</body>
</html>
