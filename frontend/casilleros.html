<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casilleros | Casilleros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .grid-casilleros { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
  </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a></li></ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><span class="nav-link"><span class="live-dot"></span><small id="reloj" class="mono"></small></span></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></a></li>
    </ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="dashboard.html" class="brand-link"><i class="fas fa-lock brand-image ml-1" style="color:#007bff;font-size:1.4rem;"></i><span class="brand-text font-weight-bold">CASILLEROS</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image"><i class="fas fa-user-shield fa-lg text-secondary ml-2 mt-1"></i></div>
        <div class="info"><a href="#" class="d-block" id="sidebar-nombre">Administrador</a><small id="sidebar-email" class="text-muted d-block"></small><small id="sidebar-rol" class="badge" style="font-size:9px;"></small></div>
      </div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" id="sidebar-nav"></ul></nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1 class="m-0"><i class="fas fa-boxes mr-2 text-primary"></i>Gestión de Casilleros</h1></div>
        <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a href="dashboard.html">Inicio</a></li><li class="breadcrumb-item active">Casilleros</li></ol></div>
      </div>
    </div></div>

    <div class="content"><div class="container-fluid">
      <div class="row" id="stats-casis"></div>

      <div class="filter-bar">
        <div class="form-group"><label>Piso</label>
          <select id="f-piso" class="form-control form-control-sm" style="width:120px;" onchange="filtrar()">
            <option value="">Todos</option><option value="1">Piso 1</option><option value="2">Piso 2</option><option value="3">Piso 3</option>
          </select>
        </div>
        <div class="form-group"><label>Estado</label>
          <select id="f-estado" class="form-control form-control-sm" style="width:150px;" onchange="filtrar()">
            <option value="">Todos</option>
            <option value="libre">Libre</option><option value="ocupado">Ocupado</option>
            <option value="bloqueado">Bloqueado</option><option value="mantenimiento">Mantenimiento</option>
          </select>
        </div>
        <div class="ml-auto d-flex" style="gap:8px;">
          <button class="btn btn-outline-secondary btn-sm" onclick="cargarCasilleros()"><i class="fas fa-sync mr-1"></i>Actualizar</button>
          <button class="btn btn-primary btn-sm" onclick="$('#modal-nuevo-casillero').modal('show')"><i class="fas fa-plus mr-1"></i>Nuevo Casillero</button>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-9">
          <div class="card card-outline card-primary elevation-2">
            <div class="card-header">
              <h3 class="card-title"><i class="fas fa-th mr-2"></i>Vista de Grilla</h3>
              <div class="card-tools"><span class="badge badge-secondary mono" id="badge-count">—</span></div>
            </div>
            <div class="card-body" id="grid-container">
              <div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
            </div>
          </div>
        </div>
        <div class="col-lg-3">
          <div class="card card-outline card-info elevation-2" id="panel-detalle" style="display:none;">
            <div class="card-header bg-info text-white"><h3 class="card-title text-white"><i class="fas fa-info-circle mr-2"></i>Detalle</h3></div>
            <div class="card-body" id="detalle-body"></div>
            <div class="card-footer" style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn btn-success btn-sm btn-block" id="btn-abrir" onclick="abrirCasillero()">
                <i class="fas fa-lock-open mr-1"></i>Abrir Remotamente
              </button>
              <button class="btn btn-warning btn-sm btn-block" id="btn-bloquear" onclick="toggleBloquear()">
                <i class="fas fa-minus-circle mr-1"></i><span id="lbl-bloquear">Bloquear</span>
              </button>
              <button class="btn btn-secondary btn-sm btn-block" id="btn-mant" onclick="toggleMantenimiento()">
                <i class="fas fa-tools mr-1"></i><span id="lbl-mant">Mantenimiento</span>
              </button>
              <button class="btn btn-danger btn-sm btn-block" id="btn-eliminar" onclick="eliminarCasillero()">
                <i class="fas fa-trash mr-1"></i>Eliminar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div></div>
  </div>
  <footer class="main-footer"><strong>Casilleros Automatizados</strong> &copy; 2026</footer>
</div>

<!-- Modal Nuevo Casillero -->
<div class="modal fade" id="modal-nuevo-casillero" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="fas fa-plus-circle mr-2"></i>Nuevo Casillero</h5>
        <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group col-6">
            <label>Número <span class="text-danger">*</span></label>
            <input type="text" id="nc-numero" class="form-control" placeholder="Ej: C-101">
          </div>
          <div class="form-group col-3">
            <label>Piso <span class="text-danger">*</span></label>
            <select id="nc-piso" class="form-control">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            </select>
          </div>
          <div class="form-group col-3">
            <label>Zona <span class="text-danger">*</span></label>
            <input type="text" id="nc-zona" class="form-control" placeholder="Ej: A">
          </div>
        </div>
        <div class="form-group">
          <label>ID Controlador <span class="text-danger">*</span></label>
          <input type="text" id="nc-controlador" class="form-control" placeholder="Ej: CTRL-01">
        </div>
        <div class="form-group">
          <label>Puerto Controlador <span class="text-danger">*</span></label>
          <input type="number" id="nc-puerto" class="form-control" placeholder="Ej: 1" min="1">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarNuevoCasillero()">
          <i class="fas fa-save mr-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/auth.js"></script>
<script src="js/api-client.js"></script>
<script src="js/layout.js"></script>
<script>
if (!requireAuth()) throw new Error("no auth");
renderLayout("casilleros");
iniciarReloj();

let todosCasilleros = [];
let selectedId = null;
const estadoBg     = { libre:"#f0fff4", ocupado:"#f0f6ff", bloqueado:"#fff5f5", mantenimiento:"#fffdf0" };
const estadoBorder = { libre:"#28a745", ocupado:"#007bff", bloqueado:"#dc3545", mantenimiento:"#ffc107" };
const estadoEmoji  = { libre:"🔓", ocupado:"🔒", bloqueado:"⛔", mantenimiento:"🔧" };
const estadoColor  = { libre:"success", ocupado:"primary", bloqueado:"danger", mantenimiento:"warning" };

async function cargarCasilleros() {
  document.getElementById("grid-container").innerHTML =
    `<div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>`;
  try {
    todosCasilleros = await API.casilleros.listar();
    renderStats();
    filtrar();
    if (selectedId) seleccionar(selectedId);
  } catch (err) {
    document.getElementById("grid-container").innerHTML = `
      <div class="text-center py-5">
        <i class="fas fa-exclamation-triangle fa-2x text-danger mb-2 d-block"></i>
        <span class="text-danger">${err.message}</span><br>
        <button class="btn btn-sm btn-outline-danger mt-2" onclick="cargarCasilleros()">Reintentar</button>
      </div>`;
  }
}

function renderStats() {
  const data = [
    { label:"Libres",        estado:"libre",        val:todosCasilleros.filter(c=>c.estado==="libre").length,        color:"success", icon:"fa-lock-open"    },
    { label:"Ocupados",      estado:"ocupado",      val:todosCasilleros.filter(c=>c.estado==="ocupado").length,      color:"primary", icon:"fa-lock"         },
    { label:"Bloqueados",    estado:"bloqueado",    val:todosCasilleros.filter(c=>c.estado==="bloqueado").length,    color:"danger",  icon:"fa-minus-circle" },
    { label:"Mantenimiento", estado:"mantenimiento",val:todosCasilleros.filter(c=>c.estado==="mantenimiento").length,color:"warning", icon:"fa-tools"        },
  ];
  document.getElementById("stats-casis").innerHTML = data.map(s => `
    <div class="col-lg-3 col-6">
      <div class="card stat-card elevation-2" style="border-color:var(--${s.color}); cursor:pointer;"
           onclick="document.getElementById('f-estado').value='${s.estado}';filtrar()">
        <div class="card-body">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value text-${s.color}">${s.val}</div>
          <i class="fas ${s.icon} stat-icon text-${s.color}"></i>
        </div>
      </div>
    </div>`).join("");
}

function filtrar() {
  const piso   = document.getElementById("f-piso").value;
  const estado = document.getElementById("f-estado").value;
  const filtrados = todosCasilleros.filter(c =>
    (!piso   || c.piso   === Number(piso)) &&
    (!estado || c.estado === estado)
  );
  document.getElementById("badge-count").textContent = `${filtrados.length} casilleros`;
  document.getElementById("grid-container").innerHTML = `
    <div class="grid-casilleros">
      ${filtrados.map(c => `
        <div class="casillero-cell ${c.estado} ${selectedId===c.id?"selected":""}"
             onclick="seleccionar(${c.id})"
             style="border-color:${estadoBorder[c.estado]};background:${estadoBg[c.estado]};">
          <div class="casillero-icono">${estadoEmoji[c.estado]}</div>
          <div class="casillero-numero">${escapeHtml(c.numero)}</div>
          <div style="font-size:9px;color:#6c757d;">P${c.piso} · Z${escapeHtml(c.zona)}</div>
          ${c.usuario_nombre ? `<div class="casillero-user">${escapeHtml(c.usuario_nombre.split(" ")[0])}</div>` : ""}
        </div>`).join("")}
    </div>`;
}

function seleccionar(id) {
  selectedId = id;
  const c = todosCasilleros.find(x => x.id === id);
  if (!c) return;
  document.getElementById("panel-detalle").style.display = "block";
  document.getElementById("detalle-body").innerHTML = `
    <table class="table table-sm table-borderless mb-0" style="font-size:13px;">
      <tr><td class="text-muted">Número</td><td class="mono font-weight-bold">${escapeHtml(c.numero)}</td></tr>
      <tr><td class="text-muted">Piso</td><td>${c.piso}</td></tr>
      <tr><td class="text-muted">Zona</td><td>${escapeHtml(c.zona)}</td></tr>
      <tr><td class="text-muted">Estado</td><td><span class="badge badge-${estadoColor[c.estado]}">${c.estado}</span></td></tr>
      <tr><td class="text-muted">Usuario</td><td>${c.usuario_nombre ? escapeHtml(c.usuario_nombre) : `<span class="text-muted">Libre</span>`}</td></tr>
    </table>`;

  // Actualizar etiquetas de botones según estado actual
  const bloqueado = c.estado === "bloqueado";
  document.getElementById("lbl-bloquear").textContent = bloqueado ? "Desbloquear" : "Bloquear";
  document.getElementById("btn-bloquear").className = `btn btn-sm btn-block ${bloqueado ? "btn-outline-warning" : "btn-warning"}`;

  const enMant = c.estado === "mantenimiento";
  document.getElementById("lbl-mant").textContent = enMant ? "Quitar Mantenimiento" : "Mantenimiento";
  document.getElementById("btn-mant").className = `btn btn-sm btn-block ${enMant ? "btn-outline-secondary" : "btn-secondary"}`;

  // No se puede abrir si está bloqueado o en mantenimiento
  document.getElementById("btn-abrir").disabled = bloqueado || enMant;

  // No se puede eliminar si está ocupado
  document.getElementById("btn-eliminar").disabled = c.estado === "ocupado";

  filtrar();
}

async function abrirCasillero() {
  if (!selectedId) return;
  try {
    await API.casilleros.abrir(selectedId);
    const c = todosCasilleros.find(x => x.id === selectedId);
    toast(`✅ Apertura enviada al casillero <strong>${escapeHtml(c.numero)}</strong>`, "success");
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

async function toggleBloquear() {
  if (!selectedId) return;
  const c = todosCasilleros.find(x => x.id === selectedId);
  const nuevoEstado = c.estado === "bloqueado" ? "libre" : "bloqueado";
  const accion = nuevoEstado === "bloqueado" ? "bloquear" : "desbloquear";
  if (!confirm(`¿${accion.charAt(0).toUpperCase()+accion.slice(1)} el casillero ${c.numero}?`)) return;
  try {
    await API.casilleros.cambiarEstado(selectedId, nuevoEstado);
    toast(`Casillero <strong>${escapeHtml(c.numero)}</strong> ${accion === "bloquear" ? "bloqueado" : "desbloqueado"}.`, "info");
    await cargarCasilleros();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

async function toggleMantenimiento() {
  if (!selectedId) return;
  const c = todosCasilleros.find(x => x.id === selectedId);
  const nuevoEstado = c.estado === "mantenimiento" ? "libre" : "mantenimiento";
  const accion = nuevoEstado === "mantenimiento" ? "poner en mantenimiento" : "quitar de mantenimiento";
  if (!confirm(`¿Desea ${accion} el casillero ${c.numero}?`)) return;
  try {
    await API.casilleros.cambiarEstado(selectedId, nuevoEstado);
    toast(`Casillero <strong>${escapeHtml(c.numero)}</strong> actualizado.`, "info");
    await cargarCasilleros();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

async function eliminarCasillero() {
  if (!selectedId) return;
  const c = todosCasilleros.find(x => x.id === selectedId);
  if (c.estado === "ocupado") {
    toast("No se puede eliminar un casillero ocupado. Primero libéralo.", "warning");
    return;
  }
  if (!confirm(`¿Eliminar el casillero ${c.numero}? Esta acción no se puede deshacer.`)) return;
  try {
    await API.casilleros.eliminar(selectedId);
    toast(`Casillero <strong>${escapeHtml(c.numero)}</strong> eliminado.`, "success");
    selectedId = null;
    document.getElementById("panel-detalle").style.display = "none";
    await cargarCasilleros();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

async function guardarNuevoCasillero() {
  const numero      = document.getElementById("nc-numero").value.trim();
  const piso        = parseInt(document.getElementById("nc-piso").value);
  const zona        = document.getElementById("nc-zona").value.trim();
  const controlador = document.getElementById("nc-controlador").value.trim();
  const puerto      = parseInt(document.getElementById("nc-puerto").value);

  if (!numero || !zona || !controlador || !puerto) {
    toast("Completa todos los campos obligatorios.", "warning");
    return;
  }

  try {
    const res = await API.casilleros.crear({ numero, piso, zona, controlador_id: controlador, puerto_controlador: puerto });
    toast(`Casillero <strong>${escapeHtml(res.numero)}</strong> creado correctamente.`, "success");
    $("#modal-nuevo-casillero").modal("hide");
    document.getElementById("nc-numero").value = "";
    document.getElementById("nc-zona").value = "";
    document.getElementById("nc-controlador").value = "";
    document.getElementById("nc-puerto").value = "";
    await cargarCasilleros();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
  }
}

cargarCasilleros();
</script>
</body>
</html>
