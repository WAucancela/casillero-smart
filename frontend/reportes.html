<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Casilleros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="css/shared.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a></li></ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><span class="nav-link"><span class="live-dot"></span><small id="reloj" class="mono"></small></span></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></a></li>
    </ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="dashboard.html" class="brand-link"><i class="fas fa-lock brand-image ml-1" style="color:#007bff;font-size:1.4rem;"></i><span class="brand-text font-weight-bold">CASILLEROS</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image"><i class="fas fa-user-shield fa-lg text-secondary ml-2 mt-1"></i></div>
        <div class="info"><a href="#" class="d-block" id="sidebar-nombre">Administrador</a><small id="sidebar-email" class="text-muted d-block"></small><small id="sidebar-rol" class="badge" style="font-size:9px;"></small></div>
      </div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" id="sidebar-nav"></ul></nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1 class="m-0"><i class="fas fa-chart-bar mr-2 text-primary"></i>Reportes</h1></div>
        <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a href="dashboard.html">Inicio</a></li><li class="breadcrumb-item active">Reportes</li></ol></div>
      </div>
    </div></div>

    <div class="content"><div class="container-fluid">

      <!-- Filtros -->
      <div class="filter-bar">
        <div class="form-group">
          <label>Período</label>
          <select id="f-periodo" class="form-control form-control-sm" style="width:160px;" onchange="cambiarPeriodo()">
            <option value="7">Últimos 7 días</option>
            <option value="30" selected>Últimos 30 días</option>
            <option value="90">Últimos 90 días</option>
            <option value="custom">Personalizado</option>
          </select>
        </div>
        <div class="form-group" id="grp-desde" style="display:none;">
          <label>Desde</label>
          <input id="f-desde" type="date" class="form-control form-control-sm" style="width:140px;">
        </div>
        <div class="form-group" id="grp-hasta" style="display:none;">
          <label>Hasta</label>
          <input id="f-hasta" type="date" class="form-control form-control-sm" style="width:140px;">
        </div>
        <button class="btn btn-primary btn-sm" onclick="cargarReportes()">
          <i class="fas fa-search mr-1"></i>Generar
        </button>
        <div class="ml-auto d-flex" style="gap:8px;">
          <button class="btn btn-outline-success btn-sm" onclick="exportCSV()"><i class="fas fa-file-csv mr-1"></i>CSV</button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="row" id="kpis-row">
        <div class="col-12 text-center py-4 text-muted"><i class="fas fa-spinner fa-spin mr-2"></i>Cargando…</div>
      </div>

      <!-- Gráficas -->
      <div class="row">
        <div class="col-lg-8">
          <div class="card card-primary card-outline elevation-2">
            <div class="card-header"><h3 class="card-title"><i class="fas fa-chart-line mr-2"></i>Accesos por día</h3></div>
            <div class="card-body"><div class="chart-container"><canvas id="chart-diario"></canvas></div></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card card-info card-outline elevation-2">
            <div class="card-header"><h3 class="card-title"><i class="fas fa-chart-bar mr-2"></i>Por hora del día</h3></div>
            <div class="card-body"><div class="chart-container"><canvas id="chart-hora"></canvas></div></div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-6">
          <div class="card card-warning card-outline elevation-2">
            <div class="card-header"><h3 class="card-title"><i class="fas fa-chart-pie mr-2"></i>Por departamento</h3></div>
            <div class="card-body"><div class="chart-container" style="height:220px;"><canvas id="chart-depto"></canvas></div></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card card-success card-outline elevation-2">
            <div class="card-header"><h3 class="card-title"><i class="fas fa-table mr-2"></i>Resumen por piso</h3></div>
            <div class="card-body p-0" id="tabla-pisos">
              <div class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
          </div>
        </div>
      </div>

    </div></div>
  </div>
  <footer class="main-footer"><strong>Casilleros Automatizados</strong> &copy; 2026</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/auth.js"></script>
<script src="js/api-client.js"></script>
<script src="js/layout.js"></script>
<script>
if (!requireAuth()) throw new Error("no auth");
renderLayout("reportes");
iniciarReloj();

let charDiario = null, chartHora = null, chartDepto = null;
let datosActuales = null;

function cambiarPeriodo() {
  const custom = document.getElementById("f-periodo").value === "custom";
  document.getElementById("grp-desde").style.display = custom ? "block" : "none";
  document.getElementById("grp-hasta").style.display = custom ? "block" : "none";
}

function getParams() {
  const periodo = document.getElementById("f-periodo").value;
  if (periodo === "custom") {
    return {
      fecha_inicio: document.getElementById("f-desde").value,
      fecha_fin:    document.getElementById("f-hasta").value,
    };
  }
  const hasta = new Date();
  const desde = new Date(Date.now() - Number(periodo)*24*3600000);
  return {
    fecha_inicio: desde.toISOString().slice(0,10),
    fecha_fin:    hasta.toISOString().slice(0,10),
  };
}

async function cargarReportes() {
  document.getElementById("kpis-row").innerHTML =
    `<div class="col-12 text-center py-4 text-muted"><i class="fas fa-spinner fa-spin mr-2"></i>Cargando…</div>`;
  try {
    const [rAccesos, rOcupacion] = await Promise.all([
      API.reportes.accesos(getParams()),
      API.reportes.ocupacion(),
    ]);
    datosActuales = { accesos: rAccesos, ocupacion: rOcupacion };
    renderKPIs(rAccesos.resumen, rOcupacion.resumen);
    renderChartDiario(rAccesos.detalle || []);
    renderChartHora(rAccesos.detalle || []);
    renderChartDepto(rAccesos.detalle || []);
    renderTablaPisos(rOcupacion.por_piso || []);
  } catch (err) {
    document.getElementById("kpis-row").innerHTML = `
      <div class="col-12">
        <div class="alert alert-danger">
          <i class="fas fa-exclamation-triangle mr-2"></i>
          Error: <strong>${err.message}</strong>
          <button class="btn btn-sm btn-outline-danger ml-3" onclick="cargarReportes()">Reintentar</button>
        </div>
      </div>`;
  }
}

function renderKPIs(res, ocup) {
  const kpis = [
    { label:"Total accesos",      val: res?.total        ?? "—", color:"primary",   icon:"fa-door-open"   },
    { label:"Tasa de éxito",      val: (res?.tasa_exito  ?? "—") + "%", color:"success",icon:"fa-check-circle"},
    { label:"% Ocupación",        val: (ocup?.porcentaje_ocupacion ?? "—") + "%", color:"info",icon:"fa-box"},
    { label:"Accesos denegados",  val: res?.denegados    ?? "—", color:"danger",    icon:"fa-times-circle" },
  ];
  document.getElementById("kpis-row").innerHTML = kpis.map(k => `
    <div class="col-lg-3 col-md-6 col-sm-6">
      <div class="card stat-card elevation-2" style="border-color:var(--${k.color})">
        <div class="card-body">
          <div class="stat-label">${k.label}</div>
          <div class="stat-value text-${k.color}">${k.val}</div>
          <i class="fas ${k.icon} stat-icon text-${k.color}"></i>
        </div>
      </div>
    </div>`).join("");
}

function renderChartDiario(detalle) {
  // Agrupar por día
  const dias = {};
  detalle.forEach(l => {
    const d = l.timestamp.slice(0,10);
    if (!dias[d]) dias[d] = { ex:0, de:0 };
    if (l.resultado === "exitoso") dias[d].ex++;
    else dias[d].de++;
  });
  const labels = Object.keys(dias).sort();
  if (charDiario) charDiario.destroy();
  charDiario = new Chart(document.getElementById("chart-diario"), {
    type: "line",
    data: {
      labels,
      datasets: [
        { label:"Exitosos",  data:labels.map(d=>dias[d].ex), borderColor:"#28a745", backgroundColor:"rgba(40,167,69,0.1)", fill:true, tension:0.3 },
        { label:"Denegados", data:labels.map(d=>dias[d].de), borderColor:"#dc3545", backgroundColor:"rgba(220,53,69,0.1)",  fill:true, tension:0.3 },
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:"top"}},
              scales:{ x:{grid:{display:false}}, y:{beginAtZero:true} } }
  });
}

function renderChartHora(detalle) {
  const horas = Array.from({length:24}, (_,h) => ({
    h, count: detalle.filter(l => new Date(l.timestamp).getHours() === h).length
  }));
  if (chartHora) chartHora.destroy();
  chartHora = new Chart(document.getElementById("chart-hora"), {
    type: "bar",
    data: {
      labels: horas.map(h => `${String(h.h).padStart(2,"0")}h`),
      datasets: [{ label:"Accesos", data:horas.map(h=>h.count), backgroundColor:"rgba(0,123,255,0.65)", borderRadius:3 }]
    },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
              scales:{ x:{grid:{display:false}}, y:{beginAtZero:true} } }
  });
}

function renderChartDepto(detalle) {
  const deptos = {};
  detalle.forEach(l => {
    if (l.departamento) { deptos[l.departamento] = (deptos[l.departamento] || 0) + 1; }
  });
  const labels  = Object.keys(deptos);
  const values  = labels.map(d => deptos[d]);
  const colors  = ["#007bff","#28a745","#ffc107","#dc3545","#17a2b8","#6f42c1"];
  if (chartDepto) chartDepto.destroy();
  chartDepto = new Chart(document.getElementById("chart-depto"), {
    type: "doughnut",
    data: { labels, datasets: [{ data:values, backgroundColor:colors.slice(0,labels.length), borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:"right"}} }
  });
}

function renderTablaPisos(pisos) {
  document.getElementById("tabla-pisos").innerHTML = pisos.length
    ? `<table class="table table-sm table-striped mb-0" style="font-size:13px;">
        <thead class="thead-light"><tr><th>Piso</th><th>Total</th><th>Ocupados</th><th>Libres</th><th>% Ocup.</th></tr></thead>
        <tbody>${pisos.map(p => `
          <tr>
            <td class="font-weight-bold">Piso ${p.piso}</td>
            <td class="mono">${p.total}</td>
            <td class="mono text-primary">${p.ocupados}</td>
            <td class="mono text-success">${p.libres}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="progress progress-sm flex-grow-1 mb-0" style="min-width:60px;">
                  <div class="progress-bar bg-${p.porcentaje_ocupacion>80?"danger":p.porcentaje_ocupacion>50?"warning":"success"}"
                       style="width:${p.porcentaje_ocupacion}%"></div>
                </div>
                <span class="mono ml-1">${p.porcentaje_ocupacion}%</span>
              </div>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>`
    : `<div class="text-center py-4 text-muted">Sin datos</div>`;
}

function exportCSV() {
  if (!datosActuales) return;
  const detalle = datosActuales.accesos.detalle || [];
  const cols  = ["ID","Fecha","Hora","Usuario","Departamento","Terminal","Casillero","Resultado"];
  const rows  = detalle.map(l => [l.id, l.timestamp.slice(0,10), l.timestamp.slice(11,19), l.usuario||"", l.departamento||"", l.terminal_id||"", l.casillero_numero||"", l.resultado]);
  const csv   = [cols,...rows].map(r=>r.join(",")).join("\n");
  const a     = document.createElement("a");
  a.href      = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download  = `reporte_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

cargarReportes();
</script>
</body>
</html>
