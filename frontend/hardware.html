<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware | Casilleros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="css/shared.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a></li></ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><span class="nav-link"><span class="live-dot"></span><small id="reloj" class="mono"></small></span></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></a></li>
    </ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="dashboard.html" class="brand-link"><i class="fas fa-lock brand-image ml-1" style="color:#007bff;font-size:1.4rem;"></i><span class="brand-text font-weight-bold">CASILLEROS</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image"><i class="fas fa-user-shield fa-lg text-secondary ml-2 mt-1"></i></div>
        <div class="info"><a href="#" class="d-block" id="sidebar-nombre">Administrador</a><small id="sidebar-email" class="text-muted d-block"></small><small id="sidebar-rol" class="badge" style="font-size:9px;"></small></div>
      </div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" id="sidebar-nav"></ul></nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1 class="m-0"><i class="fas fa-server mr-2 text-primary"></i>Estado del Hardware</h1></div>
        <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a href="dashboard.html">Inicio</a></li><li class="breadcrumb-item active">Hardware</li></ol></div>
      </div>
    </div></div>

    <div class="content"><div class="container-fluid">

      <div class="row mb-3">
        <div class="col-12 d-flex justify-content-between align-items-center">
          <span class="text-muted" style="font-size:13px;">Último refresh: <span id="ultimo-refresh" class="mono">—</span></span>
          <button class="btn btn-outline-primary btn-sm" onclick="cargarHardware()">
            <i class="fas fa-sync mr-1"></i>Actualizar todo
          </button>
        </div>
      </div>

      <!-- Terminales ZKTeco -->
      <div class="card card-primary card-outline elevation-2">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-camera mr-2"></i>Terminales ZKTeco SenseFace 2A</h3>
          <div class="card-tools"><span class="badge badge-primary mono" id="badge-terminales">—</span></div>
        </div>
        <div class="card-body" id="terminales-container">
          <div class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
        </div>
      </div>

      <!-- Controladores -->
      <div class="card card-info card-outline elevation-2">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-microchip mr-2"></i>Controladores de Cerraduras</h3>
          <div class="card-tools"><span class="badge badge-info mono" id="badge-controladores">—</span></div>
        </div>
        <div class="card-body" id="controladores-container">
          <div class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
        </div>
      </div>

    </div></div>
  </div>
  <footer class="main-footer"><strong>Casilleros Automatizados</strong> &copy; 2026</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/auth.js"></script>
<script src="js/api-client.js"></script>
<script src="js/layout.js"></script>
<script>
if (!requireAuth()) throw new Error("no auth");
renderLayout("hardware");
iniciarReloj();

let terminalesActuales = [];

async function cargarHardware() {
  document.getElementById("terminales-container").innerHTML    = `<div class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>`;
  document.getElementById("controladores-container").innerHTML = `<div class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>`;

  try {
    const [terminales, controladores] = await Promise.all([
      API.hardware.terminales(),
      API.hardware.controladores(),
    ]);

    document.getElementById("badge-terminales").textContent    = terminales.length;
    document.getElementById("badge-controladores").textContent = controladores.length;
    document.getElementById("ultimo-refresh").textContent      = new Date().toLocaleTimeString("es-EC");

    terminalesActuales = terminales;
    renderTerminales(terminales);
    renderControladores(controladores);
  } catch (err) {
    const errHtml = `
      <div class="text-center py-4">
        <i class="fas fa-exclamation-triangle fa-2x text-danger mb-2 d-block"></i>
        <span class="text-danger">${err.message}</span><br>
        <button class="btn btn-sm btn-outline-danger mt-2" onclick="cargarHardware()">Reintentar</button>
      </div>`;
    document.getElementById("terminales-container").innerHTML    = errHtml;
    document.getElementById("controladores-container").innerHTML = errHtml;
  }
}

function renderTerminales(terminales) {
  document.getElementById("terminales-container").innerHTML = `
    <div class="row">${terminales.map(t => `
      <div class="col-lg-4 col-md-6 mb-3">
        <div class="card card-outline card-${t.activo?"success":"danger"} elevation-1 mb-0">
          <div class="card-header py-2 d-flex align-items-center justify-content-between">
            <h5 class="card-title mb-0" style="font-size:14px;">
              <span class="live-dot" style="background:${t.activo?"#28a745":"#dc3545"};"></span>
              ${escapeHtml(t.descripcion)}
            </h5>
            <span class="badge badge-${t.activo?"success":"danger"}">${t.activo?"En línea":"Offline"}</span>
          </div>
          <div class="card-body py-2">
            <table class="table table-sm table-borderless mb-0" style="font-size:12px;">
              <tr><td class="text-muted">IP</td><td class="mono">${escapeHtml(t.ip_local) || "—"}</td></tr>
              <tr><td class="text-muted">Modelo</td><td>SenseFace 2A</td></tr>
              <tr><td class="text-muted">Piso</td><td>${t.piso}</td></tr>
              <tr><td class="text-muted">Serie</td><td class="mono" style="font-size:11px;">${t.numero_serie ? escapeHtml(t.numero_serie) : "—"}</td></tr>
              <tr><td class="text-muted">Últ. evento</td><td style="font-size:11px;">${t.ultimo_evento ? fmtHora(t.ultimo_evento) : "—"}</td></tr>
              <tr><td class="text-muted">Autorización</td><td>
                <span class="badge badge-${t.autorizado?"success":"danger"}">${t.autorizado?"Autorizado":"No autorizado"}</span>
              </td></tr>
            </table>
          </div>
          <div class="card-footer py-2">
            <button class="btn btn-xs btn-outline-info mr-2" onclick="pingTerminal(${t.id}, this)">
              <i class="fas fa-satellite-dish mr-1"></i>Ping
            </button>
            <button class="btn btn-xs btn-outline-warning mr-2" onclick="reiniciarDispositivo(${t.id})">
              <i class="fas fa-power-off mr-1"></i>Reiniciar
            </button>
            <button class="btn btn-xs btn-outline-${t.autorizado?"danger":"success"}" onclick="toggleAutorizacion(${t.id}, ${t.autorizado}, this)">
              <i class="fas fa-${t.autorizado?"ban":"check"} mr-1"></i>${t.autorizado?"Revocar":"Autorizar"}
            </button>
          </div>
        </div>
      </div>`).join("")}
    </div>`;
}

function renderControladores(controladores) {
  document.getElementById("controladores-container").innerHTML = `
    <div class="table-responsive">
      <table class="table table-striped table-hover mb-0" style="font-size:13px;">
        <thead class="thead-light">
          <tr><th>Nombre</th><th>IP</th><th>Piso</th><th>Puertas</th><th>MQTT</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
          ${controladores.map(c => `
            <tr>
              <td><strong>${escapeHtml(c.nombre || c.descripcion)}</strong></td>
              <td class="mono">${escapeHtml(c.ip_local) || "—"}</td>
              <td>${c.piso}</td>
              <td class="mono">${c.num_puertas || 4}</td>
              <td><span class="badge badge-${c.mqtt_conectado ? "success":"secondary"}">
                ${c.mqtt_conectado ? "Conectado":"Desconectado"}
              </span></td>
              <td><span class="badge badge-${c.activo?"success":"danger"}">${c.activo?"Activo":"Inactivo"}</span></td>
              <td>
                <button class="btn btn-xs btn-outline-info" onclick="pingTerminal(${c.id}, this)">
                  <i class="fas fa-satellite-dish mr-1"></i>Ping
                </button>
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

async function pingTerminal(id, btn) {
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
  try {
    const res = await API.hardware.ping(id);
    const ms  = res.latencia_ms ?? "OK";
    toast(`Ping exitoso — ${ms}ms`, "success");
  } catch (err) {
    toast(`Sin respuesta: ${err.message}`, "danger");
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

async function toggleAutorizacion(id, autorizadoActual, btn) {
  const nuevoValor = !autorizadoActual;
  const verbo = nuevoValor ? "autorizar" : "revocar la autorización de";
  if (!confirm(`¿Seguro que querés ${verbo} este terminal? Mientras no esté autorizado, sus eventos de acceso no abrirán ningún casillero.`)) return;

  btn.disabled = true;
  try {
    await API.hardware.autorizar(id, nuevoValor);
    toast(nuevoValor ? "Terminal autorizado" : "Autorización revocada", "success");
    cargarHardware();
  } catch (err) {
    toast(`Error: ${err.message}`, "danger");
    btn.disabled = false;
  }
}

async function reiniciarDispositivo(id) {
  const t = terminalesActuales.find(x => x.id === id);
  const nombre = t ? t.descripcion : "el terminal";
  if (!confirm(`¿Reiniciar ${nombre}? El dispositivo dejará de registrar accesos por ~30 segundos.`)) return;
  toast(`Comando de reinicio enviado a ${escapeHtml(nombre)}…`, "info");
  // POST /hardware/{id}/reiniciar — pendiente de implementar en backend
}

// Auto-refresh cada 60 segundos
cargarHardware();
setInterval(cargarHardware, 60000);
</script>
</body>
</html>
