version: "3.9"

# ══════════════════════════════════════════════════════════════
#  Sistema de Casilleros Automatizados
#  Servicios: postgres · backend · mosquitto · nginx · frontend
# ══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: casilleros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-casilleros}
      POSTGRES_USER:     ${POSTGRES_USER:-casilleros_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ:                America/Guayaquil
      PGTZ:              America/Guayaquil
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casilleros_user} -d ${POSTGRES_DB:-casilleros}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    # Puerto solo accesible desde la red interna (no expuesto al host en prod)
    # Para desarrollo local descomenta la siguiente línea:
    # ports:
    #   - "5432:5432"

  # ── Mosquitto MQTT ───────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: casilleros-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"    # MQTT sin TLS (LAN interna)
      - "8883:8883"    # MQTT con TLS (si se configura cert)
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -u ${MQTT_USER:-casilleros} -P ${MQTT_PASSWORD} -E 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend_net
      - iot_net

  # ── Backend FastAPI ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casilleros-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Sobreescribe host para usar nombre del servicio Docker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-casilleros_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-casilleros}"
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      TZ: America/Guayaquil
    volumes:
      # Montar código solo en desarrollo; en prod usar imagen construida
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend_net
      - iot_net
    # En prod el backend NO está expuesto directamente; nginx hace proxy
    # Para debug local descomenta:
    # ports:
    #   - "8000:8000"

  # ── Nginx (reverse proxy + frontend estático) ────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: casilleros-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Descomentar para HTTPS con certificados propios:
      # - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend_net

  # ── Migraciones (se ejecuta una vez y termina) ───────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: casilleros-migrate
    restart: "no"
    command: ["sh", "-c", "cd /app/database && alembic upgrade head"]
    volumes:
    - ./database:/app/database
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-casilleros_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-casilleros}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net

# ── Redes ────────────────────────────────────────────────────
networks:
  backend_net:
    driver: bridge
    name: casilleros_backend
  iot_net:
    driver: bridge
    name: casilleros_iot

# ── Volúmenes persistentes ───────────────────────────────────
volumes:
  postgres_data:
    name: casilleros_postgres_data
  mosquitto_data:
    name: casilleros_mosquitto_data
  mosquitto_log:
    name: casilleros_mosquitto_log
