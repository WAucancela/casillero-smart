# ══════════════════════════════════════════════════════════════
#  Mosquitto MQTT Broker — Casilleros Automatizados
# ══════════════════════════════════════════════════════════════

# ── Listeners ────────────────────────────────────────────────
listener 1883
protocol mqtt

# WebSocket (útil para debug desde browser en dev)
# listener 9001
# protocol websockets

# ── Autenticación ─────────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/config/passwd

# ── Persistencia ─────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logs ──────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Límites de conexión ───────────────────────────────────────
max_connections 200
max_inflight_messages 20
max_queued_messages 1000

# ── Topics del sistema ────────────────────────────────────────
# casilleros/cmd/{controlador_id}/{puerta}   → abrir | bloquear
# casilleros/status/{controlador_id}/{puerta} → abierto | cerrado
# casilleros/alert/{tipo}                    → alertas
