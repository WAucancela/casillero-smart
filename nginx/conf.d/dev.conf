# Override para desarrollo: sin cache, CORS abierto, logs verbosos

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index login.html;

    # Sin cache en desarrollo
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ /login.html;
    }

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;

        # CORS abierto en dev
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    location /iclock/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs    { proxy_pass http://backend:8000/docs;         proxy_http_version 1.1; proxy_set_header Host $host; }
    location /redoc   { proxy_pass http://backend:8000/redoc;        proxy_http_version 1.1; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; proxy_http_version 1.1; proxy_set_header Host $host; }
}
