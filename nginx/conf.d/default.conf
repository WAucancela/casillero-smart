# ══════════════════════════════════════════════════════════════
#  nginx virtual host — Casilleros Automatizados
#  Sirve:
#    /         → frontend estático (AdminLTE HTML)
#    /api/     → proxy al backend FastAPI
#    /docs     → Swagger UI (solo en dev; comentar en prod)
#    /ws/      → WebSocket proxy
# ══════════════════════════════════════════════════════════════

upstream backend_app {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Seguridad ──────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Frontend Angular (SPA) ─────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback a index.html: el router de Angular maneja las rutas
        try_files $uri $uri/ /index.html;

        # Cache de assets (JS, CSS, fuentes)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Health check propio de nginx ───────────────────────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Proxy → Backend FastAPI ────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para biometría (DeepFace puede tardar)
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        # Tamaño máximo de body para subir imágenes de biometría
        client_max_body_size 10M;
    }

    # ── WebSocket (monitor en vivo) ────────────────────────────
    location /ws/ {
        proxy_pass         http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;    # Mantener WS abierto 1 hora
    }

    # ── ZKTeco ADMS Push ───────────────────────────────────────
    location /iclock/ {
        proxy_pass         http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El SenseFace 2A no manda headers CORS; no los exigimos aquí
    }

    # ── Swagger / Redoc (comentar en producción) ───────────────
    location /docs {
        proxy_pass http://backend_app/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://backend_app/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_app/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Bloquear acceso a archivos sensibles ───────────────────
    location ~ /\. { deny all; }
    location ~ \.(env|sql|sh|md)$ { deny all; }
}
